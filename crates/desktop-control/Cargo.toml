[package]
name = "desktop-control"
version = "0.1.0"
description = "Screenshots and mouse and keyboard input for the agent's desktop-control tool (macOS)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGEvent",
    "CGEventTypes",
    "CGRemoteOperation",
    "CGWindow",
] }
